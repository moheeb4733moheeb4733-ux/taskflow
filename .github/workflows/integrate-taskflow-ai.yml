name: Integrate TaskFlow AI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'taskflow-ai-widget.js'
      - '.github/workflows/integrate-taskflow-ai.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add TaskFlow AI script to original dashboard
        shell: bash
        run: |
          set -e
          if grep -q 'taskflow-ai-widget.js' index.html; then
            echo 'TaskFlow AI is already integrated.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          if marker not in s:
              raise SystemExit('Could not find </head> in index.html')
          s = s.replace(marker, '  <script src="/taskflow-ai-widget.js" defer></script>\n'+marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: integrate TaskFlow AI into original dashboard'
          git push origin main
