name: Integrate TaskFlow AI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'taskflow-ai-widget.js'
      - 'ai-data-layer.js'
      - '.github/workflows/integrate-taskflow-ai.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate TaskFlow AI data layer and widget
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          if marker not in s:
              raise SystemExit('Could not find </head> in index.html')
          tags = [
              '<script src="/ai-data-layer.js" defer></script>',
              '<script src="/taskflow-ai-widget.js" defer></script>'
          ]
          changed = False
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, '  ' + tag + '\n' + marker, 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
          else:
              print('TaskFlow AI integration is already complete.')
          PY
          if git diff --quiet -- index.html; then
            echo 'No dashboard integration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: connect TaskFlow AI to live data layer'
          git push origin main
