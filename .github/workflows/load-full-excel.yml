name: Load TaskFlow AI full Excel analyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-full-excel-analyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure full Excel analyzer is loaded
        shell: bash
        run: |
          set -e
          if grep -q 'taskflow-ai-excel-full.js' index.html; then
            echo 'Full Excel analyzer already loaded.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="taskflow-permissions.js"></script>'
          injection = marker + '\n<script src="taskflow-ai-excel-full.js"></script>'
          if marker not in s:
              raise SystemExit('permissions script marker not found')
          p.write_text(s.replace(marker, injection, 1), encoding='utf-8')
          PY

      - name: Commit injection
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load full Excel aggregation layer for TaskFlow AI'
          git push
